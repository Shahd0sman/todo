<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/main.css">
    <title>Todo</title>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-top">
            <a href="dashboard.html" class="sidebar-brand">Todo</a>
            <button class="add-task" id="add">+</button>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidelinks " id="dashboard">Dashboard</a>
            <a href="progress.html" class="sidelinks " id="progress">Progress</a>
            <a href="tasks.html" class="sidelinks " id="tasks">Tasks</a>
        </nav>
    </div>
    <div class="pic">
      <img src="assets/ChatGPT Image Sep 27, 2026, 07_13_17 AM.png">
      <div>
         <h1>No tasks yet!</h1>
          <div class="p">
          <p>start small ,add your first task </p>
          <p>and make today count</p>
          </div>
         </div>
      </div>
      <div class="modal" id="modal">
        <h1>Add Task</h1>
        <div class="taskinp">
          <input placeholder="Task Title..." id="title">
          <button class="add" id="subtasks-btn">+ Subtasks</button>
        </div>
        <div class="task-details">
          <!--category and date-->
          <div class="date-category">
            <div class="labels">
              <label for="date">Deadline</label>
            <input type="date" class="calender" id="date">
            </div>
            <div class="labels">
              <label for="category">Category</label>
          <input placeholder="school,home,work..." id="category">
            </div>
          </div>
          </div>
          <!--Priority-->
          <div class="labels">
            <label for="priority">Priority</label>
            <div class="priority-btn">
              <button class="low btn p" id="low" value="low">Low</button>
              <button class="medium btn p" id="medium" value="medium">Medium</button>
              <button class="high btn p" id="high" value="high">High</button>
            </div>
          </div>
          <!--status-->
          <div class="status">
            <label for="status">Set Status</label>
            <div class="status-btn">
              <button class="todo btn s" value="to-do">To-do</button>
              <button class="medium btn s" value="in progress">In Progress</button>
              <button class="done btn s" value="done">Done</button>
            </div>
          </div>
           <div class="modal-btn">
            <button class="cancel" id="cancel">Cancel</button>
            <button class="add" id="addtask">Add</button>
        </div>
          </div>
          <div id="overlay"></div>
          <div class="counting" id="counting">
            <div class="totaltasks card">
              <h1>total tasks</h1>
              <div class="total">
                <h5 id="total"></h5>
                <button class="total-btn btnd">see tasks</button>
              </div>
              
            </div>
            <div class="totalprogress card">
              <h1>total in progress</h1>
               <div class="total">
                <h5 id="totalprogress">0</h5>
                <button class="progress-btn btnd">see tasks</button>
              </div>
            </div>
            <div class="totalhigh card">
              <h1>total high priority</h1>
               <div class="total">
                <h5 id="totalhigh"></h5>
                <button class="high-btn btnd">see tasks</button>
              </div>
            </div>
            <div class="totaldone card">
              <h1>total done</h1>
              <div class="total">
                <h5 id="totaldone">o</h5>
                <button class="done-btn btnd">see tasks</button>
              </div>
            </div>
          </div>
          
<script src="scripts/main.js"></script>
<script src="scripts/dashboard.js"></script>
</body>
</html>
