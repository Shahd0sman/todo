<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>
    <title>login</title>
</head>
<body>
    <div class="box">
        <div class="heading">
            <h1>Login</h1>
            <p>Don't have account?<a href="register.html">Sign up</a></span></p>
        </div>
        
        <form>
            <div class="inputs">
            <input placeholder="info@example.com" id="email">
            <input placeholder="********" id="password">
            <span><a href="#">Forgot your password?</a></span>
            </div>
            <div class="btns">
                 <button type="submit"><a href=dashboard.html class="login">Login</a></button>
            </div>
           
        </form>
        <h1 class="or">Or</h1>
        <div class="social">
            <i class="fa-brands fa-google"></i>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-github"></i>
        </div>
    </div>

    <script>
    lucide.createIcons();
</script>

</html>
